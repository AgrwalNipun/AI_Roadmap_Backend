version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: roadmap_ai_v2
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: roadmap-ai
    restart: always

    network_mode: service:mysql

    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ROADMAP_AI_JWT_KEY: ${ROADMAP_AI_JWT_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

volumes:
  mysql_data:
